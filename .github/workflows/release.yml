name: Build & Release MOONWAVE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. 1.8.1)'
        required: false
        default: '1.8.1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Keystore
        id: setup_keystore
        run: |
          mkdir -p $HOME/keystores
          KEYSTORE_FILE="$HOME/keystores/spatialflow.jks"
          KEY_PASS="moonwave123"
          KEY_ALIAS="moonwave"

          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD || secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating automated release signing keystore..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MOONWAVE, OU=Engineering, O=CodeTrio, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/MOONWAVE-SpatialFlow-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/MOONWAVE-SpatialFlow-debug.apk
          fi
          cd dist
          sha256sum *.apk > checksums.txt
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MOONWAVE-SpatialFlow-APKs
          path: dist/
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v1.8.1' }}
          name: MOONWAVE 1.8.1 (Powered by SpatialFlow)
          prerelease: false
          files: |
            dist/MOONWAVE-SpatialFlow-release.apk
            dist/MOONWAVE-SpatialFlow-debug.apk
            dist/checksums.txt
          body: |
            # 🌙 MOONWAVE 1.8.1 (SpatialFlow Edition)
            
            Premium Online & Offline Android Music Experience.

            ---

            ### 🚀 Major Highlights & Features:
            * **YouTube Music Streaming**: Stream millions of songs directly via high-speed caching & background prefetch.
            * **NewPipe Engine**: Native on-device YouTube stream resolution without proxy dependencies.
            * **Karaoke Synchronized Lyrics**: Real-time word-by-word karaoke highlighting across 6+ providers (SyncLRC, Apple Music, Spotify, LRCLIB, YouTube Music, Paxsenix).
            * **Music Haptics**: Beat-based dynamic vibration feedback & rhythm synchronization.
            * **Material 3 Expressive UI**: Liquid glass visual effect, wavy slider, artwork pager, sliding queue drawer.
            * **Offline Media Library**: MediaStore scanner, Albums, Artists, Folders, Smart Playlists.
            * **Hardware Audio Effects**: Equalizer, Bass Boost, Loudness Analyzer, Volume Normalizer.
            * **Song Downloader**: High-speed offline downloads with progress notifications.
            * **Personal Recap**: Listening stats, top artists, time spent listening.
            * **Desktop Widgets**: Aura (2x2), Bridge (4x2), and Dashboard (4x4) interactive widgets.

            ### 📦 Download:
            - **[MOONWAVE-SpatialFlow-release.apk](dist/MOONWAVE-SpatialFlow-release.apk)** (Signed production release)
            - **[MOONWAVE-SpatialFlow-debug.apk](dist/MOONWAVE-SpatialFlow-debug.apk)** (Developer debug build)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
