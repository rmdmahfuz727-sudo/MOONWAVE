name: Build & Release MOONWAVE

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Release Version (e.g. 2.0.0)'
        required: false
        default: '2.0.0'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APKs & Create Release
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Dedicated MOONWAVE Release Keystore
        id: setup_keystore
        run: |
          mkdir -p $HOME/keystores
          KEYSTORE_FILE="$HOME/keystores/moonwave.jks"
          KEY_PASS="moonwave_release_mahfuz_2026"
          KEY_ALIAS="moonwave_release_key"

          if [ -n "${{ secrets.MOONWAVE_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.MOONWAVE_KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.MOONWAVE_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.MOONWAVE_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.MOONWAVE_KEY_PASSWORD }}" >> $GITHUB_ENV
          elif [ -n "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > "$KEYSTORE_FILE"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.STORE_PASSWORD || secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "Generating dedicated MOONWAVE release signature key for Mahfuz Rahman..."
            keytool -genkey -v \
              -keystore "$KEYSTORE_FILE" \
              -storepass "$KEY_PASS" \
              -alias "$KEY_ALIAS" \
              -keypass "$KEY_PASS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=MOONWAVE Music Player, OU=Engineering, O=Mahfuz Rahman, C=US"
            echo "ANDROID_KEYSTORE_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS" >> $GITHUB_ENV
            echo "ANDROID_KEY_ALIAS_PASSWORD=$KEY_PASS" >> $GITHUB_ENV
          fi
          echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_FILE" >> $GITHUB_ENV

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Prepare Artifacts & Checksums
        run: |
          mkdir -p dist
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            cp app/build/outputs/apk/release/app-release.apk dist/MOONWAVE-release.apk
          fi
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            cp app/build/outputs/apk/debug/app-debug.apk dist/MOONWAVE-debug.apk
          fi
          cd dist
          sha256sum *.apk > checksums.txt
          ls -la

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MOONWAVE-APKs
          path: dist/
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name != 'main' && github.ref_name || 'v2.0.0' }}
          name: MOONWAVE v2.0.0 - Premium Music Experience
          prerelease: false
          files: |
            dist/MOONWAVE-release.apk
            dist/MOONWAVE-debug.apk
            dist/checksums.txt
          body: |
            # 🌙 MOONWAVE v2.0.0
            ### Official Original Flagship Release

            Lead Developer & Maintainer: **[Mahfuz Rahman](https://github.com/rmdmahfuz727-sudo)**  
            GitHub: [@rmdmahfuz727-sudo](https://github.com/rmdmahfuz727-sudo)

            ---

            ### 🚀 Highlights & Features:
            * 🎨 **Original MOONWAVE Visual Identity**: Official glowing lunar crescent logo, midnight black, deep navy, and electric cyan design system.
            * 🎵 **YouTube Music Online Streaming**: Instant online streaming, trending charts, artist and album discovery, backed by intelligent 6-hour caching and background prefetch.
            * ⚡ **NewPipe Extractor Engine**: Direct on-device stream resolution with zero third-party proxy dependencies.
            * 🎤 **Synchronized Karaoke Lyrics Engine**: Real-time word-by-word karaoke highlighting across 6+ providers (SyncLRC, Apple Music, Spotify, LRCLIB, YouTube Music, Paxsenix).
            * 📳 **Music Haptics**: Dynamic tactile beat vibration feedback synced with music rhythms.
            * 🎛️ **Studio Audio Lab**: 10-band hardware equalizer, bass boost, EBU R128 loudness analyzer, and volume normalizer.
            * 📁 **Offline Local Library**: MediaStore scanner, Albums, Artists, Folders, Smart Playlists, and tag editor.
            * ⬇️ **One-Click Song Downloader**: High-speed offline downloads with progress notifications.
            * 🪟 **Desktop Widgets**: Aura (2x2), Bridge (4x2), and Dashboard (4x4) interactive widgets.
            * 🔐 **Unique Release Signature**: Built and signed with Mahfuz Rahman's dedicated MOONWAVE release signature key.

            ### 🤝 Attribution & Open Source Credits:
            * Portions of the audio architecture, UI components, and streaming design are derived from **SpatialFlow** by **Shubham Karande** ([@MythicalSHUB](https://github.com/MythicalSHUB)) under the **Apache License 2.0**.
            * Lyrics parsing utilities derived from **Gramophone** ([@AkaneTan](https://github.com/AkaneTan)) under **GPL-3.0**.
            * All third-party libraries (AndroidX Media3, NewPipeExtractor, LRCLIB, Jaudiotagger, Coil, FFmpegKit) are gratefully acknowledged in accordance with their respective open-source licenses.

            ### 📦 Download Assets:
            - **[MOONWAVE-release.apk](dist/MOONWAVE-release.apk)** (Signed production release APK)
            - **[MOONWAVE-debug.apk](dist/MOONWAVE-debug.apk)** (Developer debug APK)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
